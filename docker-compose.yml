# =============================================================================
#  OzoneCast — Docker Compose
#  Kiến trúc microservice:
#    postgres         → Database PostgreSQL 16
#    database-api     → FastAPI REST API (sole gateway to PostgreSQL) :8000
#    data-ingestion   → Scheduler: NASA CMR → database-api             :8002
#    backend-services → Scheduler: Analysis + Clustering + Prediction
#    frontend         → React + Vite                                   :3000
#
#  Khởi chạy:
#    cp .env.example .env          # điền NASA_USERNAME, NASA_PASSWORD
#    docker compose up --build
# =============================================================================

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: ozone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-ozone_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ozone_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ozonecast-net

  # ── Database API (FastAPI + SQLAlchemy) ─────────────────────────────────────
  database-api:
    build:
      context: ./services/database-api
      dockerfile: Dockerfile
    container_name: ozone-database-api
    restart: unless-stopped
    env_file:
      - ./services/database-api/.env.example   # rename to .env in production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ozone_db}
    ports:
      - "8000:8000"
    volumes:
      - ./services/database-api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ozonecast-net

  # ── Data Ingestion (NASA HDF5/HE5 → PostgreSQL, every 5 min) ────────────────
  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    container_name: ozone-data-ingestion
    restart: unless-stopped
    env_file:
      - ./services/data-ingestion/.env.example
    environment:
      DATABASE_URL:                postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ozone_db}
      NASA_DATA_URL:               ${NASA_DATA_URL:-https://omisips1.omisips.eosdis.nasa.gov/data/10da43cd73977b549e32cd346b9f2a2f/OMI-Aura_L2G-OMTO3G_2026m1116_v004-2026m1117t052851.he5}
      NASA_USERNAME:               ${NASA_USERNAME:-}
      NASA_PASSWORD:               ${NASA_PASSWORD:-}
      INGESTION_INTERVAL_SECONDS:  ${INGESTION_INTERVAL_SECONDS:-300}
    ports:
      - "8002:8002"
    volumes:
      - ./services/data-ingestion/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      database-api:
        condition: service_started
    networks:
      - ozonecast-net

  # ── Backend Services (Analysis + Clustering + Prediction) ───────────────────
  backend-services:
    build:
      context: ./services/backend-services
      dockerfile: Dockerfile
    container_name: ozone-backend-services
    restart: unless-stopped
    env_file:
      - ./services/backend-services/.env.example
    environment:
      DATABASE_API_URL:              http://database-api:8000
      ANALYSIS_INTERVAL_SECONDS:     ${ANALYSIS_INTERVAL_SECONDS:-300}
      PREDICTION_INTERVAL_SECONDS:   ${PREDICTION_INTERVAL_SECONDS:-300}
      CLUSTERING_INTERVAL_SECONDS:   ${CLUSTERING_INTERVAL_SECONDS:-86400}
    ports:
      - "8004:8004"
    volumes:
      - ./services/backend-services/app:/app/app
      - backend_models:/app/models   # persist trained .pkl files
    depends_on:
      postgres:
        condition: service_healthy
      database-api:
        condition: service_started
    networks:
      - ozonecast-net

  # ── Frontend (React + Vite + Tailwind) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ozone-frontend
    restart: unless-stopped
    environment:
      VITE_DB_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - database-api
    networks:
      - ozonecast-net

volumes:
  pgdata:          # PostgreSQL persistent storage
  backend_models:  # ML model .pkl files persist across restarts

networks:
  ozonecast-net:
    driver: bridge
